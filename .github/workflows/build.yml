name: Build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build (temporarily reports errors as annotations for diagnosis)
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest 2>&1 | tee /tmp/build.log
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Report failure details as annotations
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          set +e
          cat > /tmp/report.py <<'PYEOF'
          import re
          log = open('/tmp/build.log', errors='replace').read()

          def emit(title, text, limit=6000):
              text = (text or '').strip()[:limit]
              if not text:
                  return
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=' + title + '::' + text)

          kotlin = '\n'.join(l for l in log.splitlines() if l.startswith('e: '))
          emit('kotlin-errors', kotlin)
          tests = '\n'.join(l for l in log.splitlines()
                            if ('FAILED' in l and 'Task' not in l) or 'AssertionError' in l)
          emit('test-failures', tests)
          m = re.search(r'FAILURE: Build failed.*', log, re.S)
          emit('gradle-failure', m.group(0) if m else log[-3000:])
          PYEOF
          python3 /tmp/report.py
      - name: Fail the job when the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
