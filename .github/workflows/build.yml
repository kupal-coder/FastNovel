name: Build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build (temporarily logs errors to the PR for diagnosis)
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest 2>&1 | tee /tmp/build.log
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Post failure details to the PR
        if: steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Build failure details (auto-posted, temporary CI debug step)'
            echo '```'
            grep -E "^e: |^w: .*(error|Error)|error:|FAILURE:|> Task .*FAILED|Execution failed|Caused by|org.opentest4j|java.lang.AssertionError|[0-9]+ tests? completed.*failed" /tmp/build.log | head -120
            echo '--- tail ---'
            tail -n 60 /tmp/build.log
            echo '```'
          } > /tmp/report.md
          head -c 60000 /tmp/report.md > /tmp/report_trim.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report_trim.md
      - name: Fail the job when the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
